# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yupana-crt"
version = "0.1.0"
description = "Experimental modular computation framework over discrete toroidal spaces"
readme = "README.md"
license = {text = "MIT"}
authors = [
{name = "Fabian Dario Farias"}
]
requires-python = ">=3.10"

dependencies = [
"numpy",
"networkx",
"matplotlib"
]

[project.optional-dependencies]
dev = [
"pytest",
"black",
"ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
