[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yupana-crt"
version = "0.1.0"
description = "Experimental modular circular runtime"
authors = [
    {name = "VECTOR1109"}
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["yupana*"]